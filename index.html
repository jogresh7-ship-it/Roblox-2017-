.logo,h1,h2,.gfont{font-family:"BobloxClassic","Source Sans Pro",Arial,sans-serif;font-style:normal!important;letter-spacing:.5px}h2{font-weight:400}
:root{--bg:#F2F2F2;--card:#fff;--hdr:#191919;--hov:#393B3D;--tx:#191919;--tx2:#757575;--tx3:#B8B8B8;--blue:#00A2FF;--blueh:#32B5FF;--bluea:#0074BD;--green:#02B757;--greenh:#3FC679;--greena:#018A41;--red:#E2231A;--bd:#E3E3E3;--side:#fff}
body.dark{--bg:#232527;--card:#393B3D;--tx:#fff;--tx2:#B8B8B8;--tx3:#757575;--bd:#4a4c4e;--side:#2b2d2f}
*{box-sizing:border-box}
body{margin:0;font-family:"Source Sans Pro",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
a{color:var(--blue);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
h1{font-size:32px;font-weight:700;margin:0 0 8px}h2{font-size:24px;font-weight:400;margin:16px 0 8px}h3{font-size:20px;font-weight:600;margin:12px 0 6px}
.small{font-size:12px}.meta{font-size:11px;text-transform:uppercase;color:var(--tx2)}.muted{color:var(--tx2)}
button,.btn{font-family:inherit;font-size:15px;border-radius:3px;border:1px solid var(--tx3);background:var(--card);color:var(--tx);padding:5px 12px;cursor:pointer;transition:.2s;display:inline-block}
.btn:hover{background:var(--bg);text-decoration:none}
.btn-blue{background:var(--blue);border-color:var(--blue);color:#fff}.btn-blue:hover{background:var(--blueh)}.btn-blue:active{background:var(--bluea)}
.btn-green{background:var(--green);border-color:var(--green);color:#fff}.btn-green:hover{background:var(--greenh)}.btn-green:active{background:var(--greena)}
.btn-red{background:#D86868;border-color:#D86868;color:#fff}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font-family:inherit;font-size:15px;border:1px solid var(--tx3);border-radius:3px;padding:5px 8px;background:var(--card);color:var(--tx)}
/* header */
#hdr{position:fixed;top:0;left:0;right:0;height:40px;background:var(--hdr);color:#fff;display:flex;align-items:center;z-index:100;padding:0 8px;gap:4px}
#hdr a,#hdr .hb{color:#fff;padding:0 10px;height:40px;display:flex;align-items:center;border-bottom:3px solid transparent;transition:.2s;cursor:pointer;position:relative}
#hdr a:hover,#hdr .hb:hover{background:var(--hov);text-decoration:none}
#hdr .navl:hover{border-bottom-color:#fff}
.logo{font-weight:700;font-style:italic;font-size:22px;letter-spacing:1px}
.logo .o{display:inline-block;width:14px;height:14px;background:currentColor;transform:rotate(15deg);margin:0 2px;vertical-align:-1px;box-shadow:inset 0 0 0 4px var(--hdr)}
#search{position:relative;margin:0 8px}
#search input{width:240px;background:#393B3D;border:0;color:#fff;height:28px;padding-left:28px}
#search svg{position:absolute;left:7px;top:7px}
.dd{position:absolute;top:40px;background:var(--card);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.4);border-radius:3px;min-width:180px;z-index:200;font-size:15px}
.dd div{padding:8px 12px;cursor:pointer}.dd div:hover{background:var(--bg)}
.bubble{background:var(--red);color:#fff;font-size:11px;border-radius:9px;padding:0 5px;min-width:16px;text-align:center;line-height:16px;display:inline-block}
#hdr .bubble{position:absolute;top:4px;right:2px}
.spacer{flex:1}
/* sidebar */
#side{position:fixed;top:40px;bottom:0;left:0;width:175px;background:var(--side);border-right:1px solid var(--bd);overflow:auto;transition:transform .25s;z-index:90;padding-bottom:20px}
body.sideclosed #side{transform:translateX(-176px)}
#side .me{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--bd);font-weight:700;color:var(--tx)}
#side .it{display:flex;align-items:center;gap:10px;padding:8px 12px;color:var(--tx2);font-size:15px}
#side .it:hover{color:var(--tx);background:var(--bg);text-decoration:none}
#side .it.act{color:var(--tx);font-weight:600;border-left:4px solid var(--blue);padding-left:8px}
#side .it .bubble{margin-left:auto}
#main{margin-top:40px;margin-left:175px;padding:16px 12px 0;transition:margin .25s;min-height:calc(100vh - 40px)}
body.sideclosed #main{margin-left:0}
.wrap{max-width:970px;margin:0 auto}.wrap.wide{max-width:1220px}
.card{background:var(--card);border-radius:3px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:8px}.wrapflex{flex-wrap:wrap}
.between{justify-content:space-between}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin-top:18px}
.sechead h2{margin:0}
/* carousels/cards */
.car{position:relative}.car .track{display:flex;gap:12px;overflow-x:auto;scroll-behavior:smooth;padding:6px 2px;scrollbar-width:none}.car .track::-webkit-scrollbar{display:none}
.car .arr{position:absolute;top:40%;width:28px;height:60px;background:rgba(0,0,0,.5);color:#fff;border:0;opacity:0;z-index:2;font-size:22px;padding:0}
.car:hover .arr{opacity:1}.car .arr.l{left:0}.car .arr.r{right:0}
.gcard{width:150px;flex:0 0 150px;background:var(--card);border-radius:3px;cursor:pointer;transition:.2s;position:relative}
.gcard:hover{box-shadow:0 1px 4px rgba(0,0,0,.3);transform:translateY(-2px)}
.gcard img,.gcard canvas{width:150px;height:150px;display:block;border-radius:3px 3px 0 0}
.gcard .t{font-weight:600;font-size:15px;padding:4px 6px 0;height:42px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--tx)}
.gcard .s{font-size:12px;color:var(--tx2);padding:2px 6px 6px;display:flex;justify-content:space-between}
.gcard .tip{display:none;position:absolute;bottom:-22px;left:0;background:#191919;color:#fff;font-size:12px;padding:2px 6px;border-radius:3px;z-index:5;white-space:nowrap}
.gcard:hover .tip{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:12px}
.icard{background:var(--card);border-radius:3px;padding:8px;cursor:pointer;position:relative;transition:.2s;border:2px solid transparent}
.icard:hover{box-shadow:0 1px 4px rgba(0,0,0,.3)}
.icard img{width:110px;height:110px;display:block;margin:0 auto;border-radius:3px}
.icard .n{font-weight:600;font-size:14px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icard.eq{border-color:var(--green)}.icard.eq:after{content:"✓";position:absolute;top:4px;right:6px;background:var(--green);color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;font-size:13px;line-height:20px}
.price{color:var(--green);font-weight:600;font-size:14px}.price.paid{color:var(--tx)}
.ltd{position:absolute;left:8px;top:98px;background:var(--green);color:#fff;font-size:10px;font-weight:700;padding:1px 4px;border-radius:2px}.ltd b{color:#ffdd00}
.head{border-radius:50%;background:#ddd;display:block}
.pres{position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid var(--card);right:2px;bottom:2px}
.fr{width:84px;text-align:center;position:relative;flex:0 0 84px;cursor:pointer}
.fr .hw{position:relative;width:76px;height:76px;margin:0 auto}
.fr .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr .pop{display:none;position:absolute;top:80px;left:-30px;width:150px;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.4);padding:8px;z-index:20;border-radius:3px;font-size:13px}
.fr:hover .pop{display:block}
.tabs{display:flex;border-bottom:1px solid var(--bd);margin-bottom:12px;flex-wrap:wrap}
.tabs div{padding:10px 18px;cursor:pointer;color:var(--tx2);border-bottom:3px solid transparent;font-weight:600}
.tabs div.on{color:var(--tx);border-bottom-color:var(--blue)}
table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}th{font-weight:600;color:var(--tx2)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:500;animation:fade .2s}
#modal.show{display:flex}
#modal .box{background:var(--card);border-radius:3px;width:420px;max-width:94vw;max-height:90vh;overflow:auto;padding:16px;position:relative}
#modal .box h3{margin-top:0;border-bottom:1px solid var(--bd);padding-bottom:8px}
#modal .x{position:absolute;right:10px;top:8px;cursor:pointer;font-size:20px;color:var(--tx2)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.spin{width:32px;height:32px;position:relative;margin:12px auto;animation:sp 1.2s linear infinite}
.spin i{position:absolute;width:12px;height:12px;background:var(--blue)}.spin i:nth-child(1){left:0;top:0}.spin i:nth-child(2){right:0;top:0;opacity:.75}.spin i:nth-child(3){right:0;bottom:0;opacity:.5}.spin i:nth-child(4){left:0;bottom:0;opacity:.25}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.bar>div{height:100%;background:var(--blue);transition:width .3s}
#toasts{position:fixed;right:16px;bottom:16px;z-index:600;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card);color:var(--tx);box-shadow:0 2px 10px rgba(0,0,0,.4);border-radius:3px;padding:10px 14px;width:290px;animation:slin .3s;display:flex;gap:10px;align-items:center;font-size:14px}
@keyframes slin{from{transform:translateX(320px)}to{transform:none}}
#notif{position:fixed;top:40px;right:0;bottom:0;width:340px;background:var(--card);box-shadow:-2px 0 8px rgba(0,0,0,.3);z-index:150;transform:translateX(360px);transition:.25s;overflow:auto}
#notif.open{transform:none}
.nrow{display:flex;gap:10px;padding:10px;border-bottom:1px solid var(--bd);font-size:14px}.nrow.unread{background:rgba(0,162,255,.08)}
#chatdock{position:fixed;right:12px;bottom:0;z-index:140;display:flex;align-items:flex-end;gap:8px;flex-direction:row-reverse}
.cpanel{width:240px;background:var(--card);box-shadow:0 0 8px rgba(0,0,0,.3);border-radius:3px 3px 0 0}
.cpanel .ch{background:var(--hdr);color:#fff;padding:7px 10px;cursor:pointer;display:flex;justify-content:space-between;border-radius:3px 3px 0 0;font-size:14px}
.cpanel .cb{height:300px;overflow:auto;font-size:14px}
.cmsg{margin:4px 8px;padding:5px 8px;border-radius:8px;max-width:80%;font-size:13px}
.cmsg.me{background:var(--blue);color:#fff;margin-left:auto}.cmsg.them{background:var(--bg)}
footer{border-top:1px solid var(--bd);margin-top:40px;padding:20px 0;text-align:center;font-size:14px;color:var(--tx2)}
footer a{margin:0 10px;font-size:16px;color:var(--tx2)}
.badgeBC{display:inline-block;vertical-align:middle}
.vote{height:6px;display:flex;border-radius:3px;overflow:hidden}.vote .up{background:var(--green)}.vote .dn{background:#D86868}
.pill{display:inline-block;padding:1px 6px;border-radius:3px;background:var(--bg);font-size:12px}
.fpost{display:flex;border:1px solid var(--bd);margin-bottom:8px}.fpost .u{width:160px;background:var(--bg);padding:10px;font-size:13px}.fpost .b{flex:1;padding:10px;white-space:pre-wrap}
.sw{display:inline-block;width:24px;height:24px;border:1px solid #999;cursor:pointer;margin:1px}
@media(max-width:1300px){body:not(.sideopen) #side{transform:translateX(-176px)}body:not(.sideopen) #main{margin-left:0}}
@media(max-width:800px){#search input{width:120px}.hidesm{display:none!important}}
/* game */
#game{position:fixed;inset:0;z-index:1000;background:#000;display:none;font-family:"Source Sans Pro",Arial;color:#fff;user-select:none}
#game.on{display:block}
#game canvas{display:block}
.gtop{position:absolute;top:0;left:0;right:0;height:36px;background:rgba(0,0,0,.5);display:flex;align-items:center;gap:6px;padding:0 6px}
.gbtn{width:32px;height:28px;border-radius:4px;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.gbtn:hover{background:rgba(255,255,255,.2)}
#gchat{position:absolute;top:42px;left:8px;width:380px;background:rgba(0,0,0,.3);border-radius:3px;transition:opacity .5s;font-size:15px;text-shadow:0 1px 2px #000}
#gchat .lines{height:180px;overflow:auto;padding:6px}
#gchat input{width:100%;background:rgba(0,0,0,.4);border:0;color:#fff;border-radius:0}
#plist{position:absolute;top:42px;right:8px;width:290px;background:rgba(31,31,31,.75);border-radius:3px;font-size:14px}
#plist .r{display:flex;padding:5px 8px;border-top:1px solid rgba(255,255,255,.1);cursor:pointer;gap:6px}#plist .r:hover{background:rgba(255,255,255,.1)}
#plist .r .st{width:50px;text-align:right}
#hotbar{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.slot{width:60px;height:60px;background:rgba(31,31,31,.6);border:2px solid transparent;border-radius:3px;position:relative;font-size:11px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:3px}
.slot.on{border-color:#fff}.slot .k{position:absolute;left:3px;top:1px;font-size:12px}
#hp{position:absolute;bottom:14px;right:14px;width:200px;height:12px;background:rgba(0,0,0,.5);border-radius:6px;overflow:hidden;display:none}
#hp div{height:100%;background:#2ecc40;transition:.2s}
#vign{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px red;opacity:0;transition:opacity .3s}
.gover{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:5}
.gover.on{display:flex}
.gpanel{background:rgba(25,25,25,.92);border-radius:6px;width:760px;max-width:96vw;max-height:88vh;overflow:auto;padding:16px}
.gpanel .tabs{border-color:#555}.gpanel .tabs div{color:#aaa}.gpanel .tabs div.on{color:#fff}
.gpanel button{background:rgba(255,255,255,.1);color:#fff;border-color:#888}
.gpanel select,.gpanel input,.gpanel textarea{background:#333;color:#fff}
.gpanel .srow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #444}
#loadscr{position:absolute;inset:0;background:#2d2d2d;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9}
#badgepop{position:absolute;bottom:90px;right:14px;background:rgba(25,25,25,.9);padding:10px;border-radius:4px;display:none;gap:10px;align-items:center;width:300px}
#perf{position:absolute;top:44px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:4px 10px;font-size:12px;display:none}
#xhair{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px;display:none;pointer-events:none}
#stick{position:absolute;left:30px;bottom:90px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.15);display:none}
#stick i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.5)}
#jumpb{position:absolute;right:40px;bottom:100px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.2);display:none}
.bubblechat{position:absolute;background:#fff;color:#111;padding:4px 8px;border-radius:8px;font-size:13px;transform:translate(-50%,-100%);pointer-events:none;max-width:200px}
/* studio */
#studio{position:fixed;inset:0;z-index:1000;background:#e9e9e9;display:none;color:#111;font-size:13px}
#studio.on{display:flex;flex-direction:column}
.ribtabs{display:flex;background:#fff;border-bottom:1px solid #ccc}.ribtabs div{padding:6px 14px;cursor:pointer}.ribtabs div.on{border-bottom:2px solid #00A2FF;font-weight:600}
.ribbon{display:flex;gap:4px;background:#fff;padding:6px;border-bottom:1px solid #ccc}
.ribbon button{display:flex;flex-direction:column;align-items:center;font-size:12px;border:1px solid transparent;width:62px;padding:4px;background:#fff;color:#111}
.ribbon button:hover,.ribbon button.on{border-color:#9cf;background:#e6f3ff}
.spane{background:#fff;border:1px solid #ccc;overflow:auto}
.etree div{padding:2px 6px;cursor:pointer}.etree div.sel{background:#cde8ff}
</style>
</head>
<body>
<div id="hdr"></div><div id="side"></div>
<div id="main"></div>
<div id="notif"></div><div id="chatdock"></div><div id="toasts"></div>
<div id="modal"><div class="box"></div></div>
<div id="game"></div><div id="studio"></div>

function pageUserSearch(parts,qs){const q=(qs.q||"").toLowerCase();const l=U.filter(u=>u.name.toLowerCase().includes(q));return `<div class="wrap"><h1>Players: "${esc(qs.q||"")}"</h1>${l.map(u=>`<div class="card row">${headshot(u,48)}<div style="flex:1"><a href="#/users/${u.id}/profile"><b>${esc(u.name)}</b></a><div class="small muted">${esc(u.blurb)}</div></div><button onclick="friendBtn(${u.id})">${isFriend(u.id)?"Friends":"Add Friend"}</button></div>`).join("")||"<p class=muted>No players found.</p>"}</div>`}

/* --- messages --- */
function pageMessages(parts,qs){const tab=qs.tab||"Inbox";const box={Inbox:"inbox",Sent:"sent",News:"news",Archive:"archive"}[tab];
 if(qs.id){const m=S.messages.find(x=>x.id==qs.id);if(!m)return page404();if(!m.read){m.read=true;save();setTimeout(renderSide)}const f=m.from===0?meUser():userById(m.from);
  return `<div class="wrap"><a onclick="setQ('id','')">‹ Back to ${tab}</a><div class="card"><h2>${esc(m.subj)}</h2><div class="row">${headshot(f,48,false)}<div><b>${esc(f.name)}</b><div class="small muted">${new Date(m.t).toLocaleString()}</div></div></div><p style="white-space:pre-wrap">${esc(m.body)}</p><div class="row">${m.from!==0&&m.from!==1?`<button class="btn-blue" onclick="composeMsg(${m.from},'RE: ${esc(m.subj).replace(/'/g,"")}')">Reply</button>`:""}<button onclick="S.messages.find(x=>x.id==${m.id}).box='archive';save();setQ('id','')">Archive</button><button onclick="reportAbuse()">Report</button></div></div></div>`}
 const l=S.messages.filter(m=>m.box==box);const pg=+(qs.p||1);window.mpg=n=>setQ("p",n);
 return `<div class="wrap"><div class="row between"><h1>Messages</h1><button class="btn-blue" onclick="composeMsg()">Compose</button></div><div class="tabs">${["Inbox","Sent","News","Archive"].map(t=>`<div class="${t==tab?"on":""}" onclick="go('#/messages?tab=${t}')">${t}</div>`).join("")}</div>
 <div class="row"><label><input type="checkbox" onchange="$$('.mchk').forEach(c=>c.checked=this.checked)"> Select All</label><button onclick="bulkMsg('archive')">Archive</button><button onclick="bulkMsg('read')">Mark As Read</button><button onclick="bulkMsg('unread')">Mark As Unread</button></div>
 <div class="card" style="padding:0;margin-top:8px">${l.slice((pg-1)*20,pg*20).map(m=>{const f=m.box=="sent"?userById(m.to)||meUser():m.from===0?meUser():userById(m.from);return `<div class="row" style="padding:8px;border-bottom:1px solid var(--bd);cursor:pointer;font-weight:${m.read?400:700}"><input type="checkbox" class="mchk" value="${m.id}" onclick="event.stopPropagation()"><div class="row" style="flex:1" onclick="setQ('id',${m.id})">${headshot(f,40,false)}<div style="width:150px">${esc(f.name)}</div><div style="flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(m.subj)} <span class="muted" style="font-weight:400">— ${esc(m.body.slice(0,60))}</span></div><div class="small muted">${ago(m.t)}</div></div></div>`}).join("")||"<p class='muted' style='padding:12px'>No messages.</p>"}</div>${pager(pg,Math.ceil(l.length/20),"mpg")}</div>`}
function bulkMsg(a){$$(".mchk").filter(c=>c.checked).forEach(c=>{const m=S.messages.find(x=>x.id==c.value);if(a=="archive")m.box="archive";else m.read=a=="read"});save();refresh()}
function composeMsg(to,subj=""){modal(`<h3>New Message</h3><div class="meta">To</div><select id="mto" style="width:100%">${U.slice(1).map(u=>`<option value="${u.id}" ${u.id==to?"selected":""}>${esc(u.name)}</option>`).join("")}</select><div class="meta">Subject</div><input id="msub" style="width:100%" value="${subj}" maxlength="50"><div class="meta">Body</div><textarea id="mbody" rows="6" style="width:100%" maxlength="1000"></textarea><button class="btn-blue" onclick="sendMsg()">Send</button>`)}
function sendMsg(){const to=+$("#mto").value,s=$("#msub").value.trim()||"(no subject)",b=$("#mbody").value.trim();if(!b)return;S.messages.unshift({id:nid(),from:0,to,subj:s,body:b,t:now(),read:true,box:"sent"});save();closeModal();toast("Message sent!");
 setTimeout(()=>{S.messages.unshift({id:nid(),from:to,subj:"RE: "+s,body:pick(["ok sounds good!","lol thanks","sure, add me","who is this?","cool! see you in game"],Math.random),t:now(),read:false,box:"inbox"});save();notify(`New message from <b>${esc(userById(to).name)}</b>`,"text",{uid:to});renderSide()},6000)}
/* --- groups --- */
function allGroups(){return GRP.concat(S.myGroupsOwned)}
const grpById=id=>allGroups().find(g=>g.id==id);
function pageGroups(parts,qs){if(parts[1]=="create")return pageCreateGroup();if(parts[1])return pageGroup(+parts[1],qs);
 const mine=allGroups().filter(g=>S.groups.includes(g.id));const l=qs.q?allGroups().filter(g=>g.name.toLowerCase().includes(qs.q.toLowerCase())):allGroups();
 return `<div class="wrap" style="display:flex;gap:12px"><div class="card" style="width:220px"><h3>My Groups</h3>${mine.map(g=>`<a class="row" style="margin-bottom:6px;color:var(--tx)" href="#/groups/${g.id}">${groupEmblem(g,36)}${esc(g.name)}${S.primaryGroup==g.id?" ★":""}</a>`).join("")||"<p class=muted>None</p>"}<button class="btn-green" style="width:100%" onclick="go('#/groups/create')">Create Group</button></div>
 <div style="flex:1"><div class="row"><input id="gq" placeholder="Search groups" value="${esc(qs.q||"")}" style="flex:1"><button class="btn-blue" onclick="setQ('q',$('#gq').value)">Search</button></div>${l.map(g=>`<div class="card row" style="margin-top:8px;cursor:pointer" onclick="go('#/groups/${g.id}')">${groupEmblem(g,64)}<div><b>${esc(g.name)}</b><div class="small muted">${fmt(g.members)} Members</div><div class="small">${esc(g.desc)}</div></div></div>`).join("")}</div></div>`}
function pageGroup(id,qs){const g=grpById(id);if(!g)return page404();const tab=qs.tab||"Wall";const mem=S.groups.includes(id);const owner=g.owner===0;const ou=owner?meUser():userById(g.owner);const pg=+(qs.p||1);window.gpg=n=>setQ("p",n);
 let tb="";
 if(tab=="Wall")tb=`${mem?`<div class="row"><input id="wallin" style="flex:1" maxlength="200" placeholder="Say something..."><button class="btn-blue" onclick="const v=$('#wallin').value.trim();if(v){grpById(${id}).wall.unshift({by:0,text:v,t:now()});saveGrp(${id});route()}">Post</button></div>`:"<p class=muted>Join this group to post on the wall.</p>"}${g.wall.slice((pg-1)*8,pg*8).map(w=>{const u=w.by===0?meUser():userById(w.by);return `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--bd)">${headshot(u,40,false)}<div><b>${esc(u.name)}</b> <span class="small muted">${ago(w.t)}</span><div>${esc(w.text)}</div><a class="small" onclick="$('#wallin')&&($('#wallin').value='@${esc(u.name)} ')">Reply</a></div></div>`}).join("")}${pager(pg,Math.ceil(g.wall.length/8),"gpg")}`;
 else if(tab=="Members"){const rank=qs.rank||"Member";const ms=rank=="Owner"?[ou]:rank=="Admin"?U.slice(2,5):rank=="Guest"?[]:U.slice(5,40);tb=`<select onchange="setQ('rank',this.value)">${["Guest","Member","Admin","Owner"].map(r=>`<option ${r==rank?"selected":""}>${r}</option>`).join("")}</select><div class="row wrapflex" style="margin-top:8px">${ms.slice((pg-1)*12,pg*12).map(u=>`<div class="fr" onclick="go('#/users/${u.id}/profile')"><div class="hw">${headshot(u,76,false)}</div><div class="nm">${esc(u.name)}</div></div>`).join("")||"<p class=muted>No members with this rank.</p>"}</div>${pager(pg,Math.ceil(ms.length/12),"gpg")}`}
 else if(tab=="Games")tb=`<div class="grid">${G.slice(id*3%40,id*3%40+4).map(gcard).join("")}</div>`;
 else if(tab=="Store")tb=`<div class="igrid">${I.filter(i=>i.top=="Clothing").slice(id%8,id%8+6).map(i=>icard(i)).join("")}</div>`;
 else if(tab=="Allies")tb=`<h3>Allies</h3>${g.allies.map(grpById).filter(Boolean).map(a=>`<a class="row" href="#/groups/${a.id}">${groupEmblem(a,40)}${esc(a.name)}</a>`).join("")}<h3>Enemies</h3>${g.enemies.map(grpById).filter(Boolean).map(a=>`<a class="row" href="#/groups/${a.id}">${groupEmblem(a,40)}${esc(a.name)}</a>`).join("")}`;
 else if(tab=="Admin")tb=`<h3>Post Shout</h3><div class="row"><input id="shin" style="flex:1" maxlength="255"><button class="btn-blue" onclick="const g=grpById(${id});g.shout={by:0,t:now(),text:$('#shin').value};saveGrp(${id});route()">Post</button></div><h3>Change Rank</h3><div class="row"><select>${U.slice(5,15).map(u=>`<option>${esc(u.name)}</option>`).join("")}</select><select><option>Member</option><option>Admin</option></select><button onclick="toast('Rank updated')">Update</button></div><h3>Funds</h3><p>Group funds: <b>B$ ${comma(g.funds||0)}</b></p><div class="row"><select id="payto">${U.slice(5,15).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}</select><input id="payamt" type="number" placeholder="Amount" style="width:100px"><button class="btn-green" onclick="const a=+$('#payamt').value,g=grpById(${id});if(a>0&&a<=(g.funds||0)){g.funds-=a;saveGrp(${id});toast('Payout sent');route()}else toast('Insufficient group funds')">One-time Payout</button></div>`;
 return `<div class="wrap"><div class="card row wrapflex" style="align-items:flex-start">${groupEmblem(g,150)}<div style="flex:1"><h1>${esc(g.name)}</h1><div>Owned by <a href="#/users/${owner?0:g.owner}/profile">${esc(ou.name)}</a></div><div class="muted">${comma(g.members+(mem?1:0))} Members</div><p>${esc(g.desc)}</p>
 <div class="row">${owner?"":`<button class="${mem?"":"btn-green"}" onclick="joinGrp(${id})">${mem?"Leave Group":"Join Group"}</button>`}${mem?`<label><input type="checkbox" ${S.primaryGroup==id?"checked":""} onchange="S.primaryGroup=this.checked?${id}:null;save()"> Make Primary</label>`:""}</div></div></div>
 <div class="card"><div class="meta">Group Shout</div><div class="row">${headshot(g.shout.by===0?meUser():userById(g.shout.by),40,false)}<div><b>${esc((g.shout.by===0?meUser():userById(g.shout.by)).name)}</b><div>${esc(g.shout.text)}</div><div class="small muted">${ago(g.shout.t)}</div></div></div></div>
 <div class="card"><div class="tabs">${["Wall","Members","Games","Store","Allies",...owner?["Admin"]:[]].map(t=>`<div class="${t==tab?"on":""}" onclick="go('#/groups/${id}?tab=${t}')">${t}</div>`).join("")}</div>${tb}</div></div>`}
function saveGrp(id){const g=S.myGroupsOwned.find(x=>x.id==id);if(!g){/* builtin */S.grpEdits=S.grpEdits||{};const b=GRP.find(x=>x.id==id);S.grpEdits[id]={wall:b.wall,shout:b.shout}}save()}
function joinGrp(id){if(S.groups.includes(id)){S.groups=S.groups.filter(x=>x!=id);if(S.primaryGroup==id)S.primaryGroup=null}else{const lim=[5,10,20,100][S.me.bc];if(S.groups.length>=lim){toast(`You can only be in ${lim} groups. Upgrade Builders Club to join more.`);return}S.groups.push(id)}save();route()}
function pageCreateGroup(){after(()=>{$("#gemb").onchange=e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>$("#gprev").src=r.result;r.readAsDataURL(f)}}});
 return `<div class="wrap card"><h1>Create Group</h1><div class="meta">Name</div><input id="gnm" style="width:100%" maxlength="50"><div class="meta">Description</div><textarea id="gds" rows="4" style="width:100%"></textarea><div class="meta">Emblem</div><input type="file" id="gemb" accept="image/*"><img id="gprev" style="width:100px;height:100px;object-fit:cover;display:block;margin:8px 0;background:var(--bg)">
 <button class="btn-green" onclick="createGroup()">Purchase ${buxIco(14)} B$ 100</button></div>`}
function createGroup(){const n=$("#gnm").value.trim();if(!n){toast("Group name required");return}if(S.me.bc==0){toast("You need Builders Club to create groups.");go("#/premium/membership");return}
 buyFlow({name:"Group: "+n,creator:"BLOX",price:100,thumb:groupEmblemURL(n),onBuy:()=>{const id=nid();S.myGroupsOwned.push({id,name:n,owner:0,members:0,color:pick(BRICK.slice(5,30),Math.random),desc:$("#gds").value||"",shout:{by:0,t:now(),text:"Welcome to my new group!"},allies:[],enemies:[],wall:[],funds:0});S.groups.push(id);setTimeout(()=>go("#/groups/"+id),50)}})}
function groupEmblemURL(n){return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(groupEmblem({name:n,color:"#0D69AC"},110).replace("<svg ",'<svg xmlns="http://www.w3.org/2000/svg" '))}
(function applyGrpEdits(){if(S.grpEdits)for(const id in S.grpEdits){const g=GRP.find(x=>x.id==id);if(g)Object.assign(g,S.grpEdits[id])}})();

/* --- trade --- */
function pageTrade(parts,qs){if(qs.new)return pageNewTrade(+qs.new);const tab=qs.tab||"Inbound";
 if(qs.id){const t=S.trades.find(x=>x.id==qs.id);if(!t)return page404();const u=userById(t.with);const tile=ids=>ids.map(itemById).map(i=>`<div style="width:110px;text-align:center"><img src="${itemThumb(i)}" width="100"><div class="small">${esc(i.name)}</div></div>`).join("");
  return `<div class="wrap"><a onclick="setQ('id','')">‹ Back</a><div class="card"><h2>Trade with ${esc(u.name)}</h2><div class="row" style="align-items:flex-start"><div style="flex:1"><h3>Your Offer</h3><div class="row wrapflex">${tile(t.mine)||"<p class=muted>Nothing</p>"}</div>${t.myBux?`<p>+ B$ ${t.myBux}</p>`:""}</div><div style="flex:1"><h3>Their Offer</h3><div class="row wrapflex">${tile(t.theirs)}</div>${t.theirBux?`<p>+ B$ ${t.theirBux} <span class="small muted">(after 30% tax: ${Math.floor(t.theirBux*.7)})</span></p>`:""}</div></div>
  ${t.status=="inbound"?`<div class="row"><button class="btn-green" onclick="tradeAct(${t.id},'accept')">Accept</button><button onclick="go('#/trade?new=${t.with}')">Counter</button><button class="btn-red" onclick="tradeAct(${t.id},'decline')">Decline</button></div>`:t.status=="outbound"?`<button onclick="tradeAct(${t.id},'cancel')">Cancel</button>`:`<p class="muted">Status: ${t.status}</p>`}</div></div>`}
 const l=S.trades.filter(t=>t.status==tab.toLowerCase());
 return `<div class="wrap"><h1>Trades</h1><div class="tabs">${["Inbound","Outbound","Completed","Inactive"].map(t=>`<div class="${t==tab?"on":""}" onclick="go('#/trade?tab=${t}')">${t}</div>`).join("")}</div><div class="card" style="padding:0">${l.map(t=>{const u=userById(t.with);return `<div class="row" style="padding:8px;border-bottom:1px solid var(--bd);cursor:pointer" onclick="setQ('id',${t.id})">${headshot(u,40,false)}<div style="flex:1">${esc(u.name)}</div><div class="small muted">${dstr(t.t)}</div><span class="pill">${t.status}</span></div>`}).join("")||"<p class='muted' style='padding:12px'>No trades.</p>"}</div><p>Start a trade from a player's profile (⋯ → Trade Items).</p></div>`}
function tradeAct(id,a){const t=S.trades.find(x=>x.id==id);if(a=="accept"){if(t.mine.some(i=>!owns(i))||S.bux<t.myBux){toast("You no longer own these items.");return}t.mine.forEach(i=>S.inv.splice(S.inv.indexOf(i),1));S.inv.push(...t.theirs);S.bux+=Math.floor(t.theirBux*.7)-t.myBux;t.status="completed";toast("Trade completed!")}else t.status="inactive";save();refresh()}
let ntSel={mine:[],theirs:[]};
function pageNewTrade(uid){const u=userById(uid);const mine=S.inv.filter((v,i,a)=>a.indexOf(v)==i).map(itemById).filter(i=>i.limited);const theirs=I.filter(i=>i.limited).slice(uid%5,uid%5+8);
 const tile=(i,side)=>`<div class="icard ${ntSel[side].includes(i.id)?"eq":""}" onclick="ntToggle('${side}',${i.id})"><img src="${itemThumb(i)}"><div class="n">${esc(i.name)}</div><div class="small">RAP ${comma(i.price)}</div></div>`;
 const val=s=>ntSel[s].reduce((a,i)=>a+itemById(i).price,0);
 return `<div class="wrap"><h1>Trade with ${esc(u.name)}</h1><div class="row" style="align-items:flex-start"><div class="card" style="flex:1"><h3>Your Inventory</h3><div class="igrid">${mine.map(i=>tile(i,"mine")).join("")||"<p class=muted>You have no limited items.</p>"}</div><p>Add Bux: <input id="ntb" type="number" min="0" value="0" style="width:90px"> <span class="small muted">(30% tax will be applied)</span></p></div>
 <div class="card" style="flex:1"><h3>${esc(u.name)}'s Inventory</h3><div class="igrid">${theirs.map(i=>tile(i,"theirs")).join("")}</div></div></div>
 <div class="card"><b>Summary:</b> You give ${ntSel.mine.length} item(s) (value B$ ${comma(val("mine"))}), you get ${ntSel.theirs.length} item(s) (value B$ ${comma(val("theirs"))}). <button class="btn-green" onclick="makeOffer(${uid})">Make Offer</button></div></div>`}
function ntToggle(s,id){const a=ntSel[s];if(a.includes(id))a.splice(a.indexOf(id),1);else if(a.length<4)a.push(id);else toast("Maximum 4 items per side.");route()}
function makeOffer(uid){const b=+$("#ntb").value||0;if(!ntSel.mine.length&&!b||!ntSel.theirs.length){toast("Pick at least one item on each side.");return}if(b>S.bux){toast("Not enough Bux.");return}
 const t={id:nid(),with:uid,status:"outbound",t:now(),mine:[...ntSel.mine],theirs:[...ntSel.theirs],myBux:b,theirBux:0};S.trades.unshift(t);ntSel={mine:[],theirs:[]};save();toast("Trade sent!");go("#/trade?tab=Outbound")}

/* --- inventory --- */
function pageInventory(parts,qs){const cat=qs.cat||"Hats";const map={Gear:i=>i.top=="Gear",Hats:i=>i.sub=="Hats"||i.sub=="Hair",Faces:i=>i.sub=="Faces",Packages:i=>i.sub=="Packages",["T-Shirts"]:i=>i.sub=="T-Shirts",Shirts:i=>i.sub=="Shirts",Pants:i=>i.sub=="Pants",Animations:i=>i.top=="Avatar Animations"};
 let body;if(cat=="Badges")body=S.badges.map(b=>`<div class="icard"><div style="width:110px;height:110px;border-radius:50%;background:#E8AB2D;margin:auto;display:flex;align-items:center;justify-content:center">${ico("star",50,"#fff")}</div><div class="n">${esc(b.n)}</div></div>`).join("");

  else if(qs.cfg){const g=gameById(+qs.cfg);body=`<h2>Configure ${esc(g.name)}</h2><div class="tabs">${["Basic Settings","Icon","Thumbnails","Access","Permissions","Version History","Developer Products","Advanced"].map((t,i)=>`<div class="${(qs.ct||"Basic Settings")==t?"on":""}" onclick="setQ('ct','${t}')">${t}</div>`).join("")}</div>${cfgTab(g,qs.ct||"Basic Settings")}`}
  else if(qs.stats){const g=gameById(+qs.stats);const per=qs.per||"Day";const r=rng(g.seed);const n={Day:24,Week:7,Month:30}[per];const v=Array.from({length:n},()=>ri(0,g.visits/1e4+50,r)),b=v.map(x=>Math.floor(x*.1));const line=(a,c)=>`<polyline fill="none" stroke="${c}" stroke-width="2" points="${a.map((x,k)=>`${k*(600/(n-1))},${140-x/Math.max(1,...a)*130}`).join(" ")}"/>`;
   body=`<h2>Developer Stats: ${esc(g.name)}</h2><div class="row">${["Day","Week","Month"].map(p=>`<button class="${p==per?"btn-blue":""}" onclick="setQ('per','${p}')">${p}</button>`).join("")}</div><h3>Visits</h3><svg viewBox="0 0 600 150" width="100%" height="150">${line(v,"#00A2FF")}</svg><h3>Bux Earned</h3><svg viewBox="0 0 600 150" width="100%" height="150">${line(b,"#02B757")}</svg>`}
  else{const items=sub=="Games"||sub=="Places"?S.creations.filter(c=>c.kind=="game"):sub=="Group Games"?[]:(S.devAssets||[]).filter(a=>a.sub==sub);
   body=`<div class="row between"><h2>${sub}</h2>${sub=="Games"?`<button class="btn-green" onclick="setQ('create',1)">Create New Game</button>`:`<button class="btn-blue" onclick="uploadAsset('${sub}')">Create / Upload</button>`}</div>${items.map(g=>`<div class="row" style="border-bottom:1px solid var(--bd);padding:8px 0">${g.kind=="game"?`<img src="${gameThumb(g,100,56)}">`:`<div style="width:100px;height:56px;background:var(--bg);display:flex;align-items:center;justify-content:center">${ico("blog",24)}</div>`}<div style="flex:1"><a href="${g.kind=="game"?"#/games/"+g.id:"#/develop"}"><b>${esc(g.name)}</b></a><div class="small ${g.active!==false?"price":"muted"}">${g.active!==false?"Active":"Inactive"}</div></div>${g.kind=="game"?`<span class="hb" style="position:relative;cursor:pointer" onclick="event.stopPropagation();cogMenu(this,${g.id})">${ico("gear",20)}</span>`:""}</div>`).join("")||`<p class="muted">You haven't created any ${sub.toLowerCase()} yet.</p>`}`}
  body=`<div style="display:flex;gap:12px"><div style="width:160px">${["Games","Places","Models","Decals","Badges","Game Passes","Audio","Animations","Group Games","Meshes","Plugins","Sponsored Ads"].map(s=>`<div><a style="color:${s==sub?"var(--blue)":"var(--tx)"};font-weight:${s==sub?700:400}" onclick="go('#/develop?sub=${encodeURIComponent(s)}')">${s}</a></div>`).join("")}</div><div style="flex:1">${body}</div></div>`}
 else if(tab=="Library"){const q=(qs.q||"").toLowerCase(),t=qs.lt||"Models";const names={Models:["Tree","House","Car","Sword","Zombie","Brick Wall","Lamp Post","Teleporter","Admin Commands","Spawn Point"],Audio:["Oof","Epic Battle Music","Calm Piano","Rain Ambience","Explosion","Victory Fanfare"],Decals:["Smiley","Logo","Grass Texture","Stop Sign","Arrow"],Plugins:["Building Tools","Lighting Presets","Terrain Helper","Model Resizer"]}[t].filter(n=>n.toLowerCase().includes(q));
  body=`<div class="row"><select onchange="setQ('lt',this.value)">${["Models","Audio","Decals","Plugins"].map(x=>`<option ${x==t?"selected":""}>${x}</option>`).join("")}</select><input id="lq" value="${esc(qs.q||"")}" style="flex:1" placeholder="Search the library"><button class="btn-blue" onclick="setQ('q',$('#lq').value)">Search</button></div><div class="igrid" style="margin-top:8px">${names.map((n,k)=>`<div class="icard" onclick="(S.devAssets=S.devAssets||[]).push({id:nid(),name:'${n}',sub:'${t}'});save();toast('${n} added to your ${t}.')"><img src="${itemThumb({id:"lib"+t+k,top:"x",color:BRICK[k*3+9],seed:k})}"><div class="n">${n}</div><div class="small muted">By ${esc(pick(U,rng(k+t.length)).name)}</div><div class="price">Free</div></div>`).join("")||"<p class=muted>No results.</p>"}</div>`}
 else if(tab=="Developer Exchange")body=`<h2>Developer Exchange (DevEx)</h2><p>Earn real-world rewards for the Bux your games earn. <i>(Demo: no real payouts.)</i></p><table><tr><th>Requirement</th><th>Status</th></tr><tr><td>Be 13 or older</td><td>✓</td></tr><tr><td>Builders Club membership</td><td>${S.me.bc?"✓":"✗"}</td></tr><tr><td>At least 100,000 earned Bux</td><td>${S.bux>=1e5?"✓":"✗"} (${comma(S.bux)})</td></tr></table><button class="btn-green" style="margin-top:10px" onclick="toast('Not eligible yet — keep building!')">Cash Out</button>`;
 else body=`<h2>Builders</h2><p>Resources for creators: tutorials, the API reference and the developer forum.</p><div class="grid">${["Getting Started","Building an Obby","Intro to Scripting","Publishing Your Game","Making Money","Using Terrain"].map((t,k)=>`<div class="card" style="cursor:pointer" onclick="toast('Tutorial coming soon')"><img src="${gameThumb({seed:k*55+3},150,80)}" style="width:100%"><b>${t}</b></div>`).join("")}</div>`;
 return `<div class="wrap"><h1>Develop</h1><div class="tabs">${["My Creations","Library","Developer Exchange","Builders"].map(t=>`<div class="${t==tab?"on":""}" onclick="go('#/develop?tab=${encodeURIComponent(t)}')">${t}</div>`).join("")}</div><div class="card">${body}</div></div>`}
function uploadAsset(sub){modal(`<h3>Create ${sub}</h3><input id="an" style="width:100%" placeholder="Name"><input type="file" style="margin:8px 0"><button class="btn-blue" onclick="(S.devAssets=S.devAssets||[]).push({id:nid(),name:$('#an').value||'Untitled',sub:'${sub}'});save();closeModal();route()">Upload</button>`)}
function createGame(){const n=$("#ngn").value.trim()||"Untitled Game";const id=nid();const tpl=window._tpl||"Baseplate";
 S.creations.push({id,kind:"game",name:n,desc:$("#ngd").value||"A new "+tpl+" game.",genre:$("#ngg").value,creator:0,playing:0,visits:0,up:0,dn:0,fav:0,created:now(),updated:now(),maxp:12,seed:id*7919,passes:[{id:"p"+id+"a",name:"VIP",price:100}],badges:[{n:"Welcome!",d:"You joined the game.",r:100},{n:"Halfway There",d:"Reach stage 5.",r:50},{n:"Obby Master",d:"Finish the obby!",r:10}],gear:true,template:tpl,access:"Public",active:true,parts:[]});
 save();toast("Game created!");go("#/develop")}
function cogMenu(el,id){$$(".dd").forEach(d=>d.remove());const d=document.createElement("div");d.className="dd";d.style.right=0;d.style.top="24px";
 d.innerHTML=[["Configure",`go('#/develop?cfg=${id}')`],["Edit",`openStudio(${id})`],["Advertise",`toast('Ad campaign started (demo).')`],["Create Badge",`go('#/develop?cfg=${id}&ct=Advanced')`],["Create Game Pass",`go('#/develop?cfg=${id}&ct=Developer Products')`],["Developer Stats",`go('#/develop?stats=${id}')`],["Shut Down All Servers",`toast('All servers shut down.')`]].map(([a,b])=>`<div onclick="${b}">${a}</div>`).join("");el.appendChild(d)}
function cfgTab(g,t){const sv=`<button class="btn-blue" style="margin-top:8px" onclick="saveCfg(${g.id})">Save</button>`;
 if(t=="Basic Settings")return `<div class="meta">Name</div><input id="cfn" style="width:100%" value="${esc(g.name)}"><div class="meta">Description</div><textarea id="cfd" rows="4" style="width:100%">${esc(g.desc)}</textarea><div class="meta">Genre</div><select id="cfg">${GENRES.map(x=>`<option ${x==g.genre?"selected":""}>${x}</option>`).join("")}</select><div class="meta">Max Players</div><input id="cfm" type="number" min="1" max="100" value="${g.maxp}">`+sv;
 if(t=="Icon"||t=="Thumbnails")return `<img src="${gameThumb(g,t=="Icon"?150:384,t=="Icon"?150:216)}"><p><input type="file" accept="image/*"></p><button onclick="g=gameById(${g.id});g.seed++;save();route()">Generate New</button>`;
 if(t=="Access")return `<label><input type="radio" name="acc" ${g.access!="Private"?"checked":""} onchange="gameById(${g.id}).access='Public';gameById(${g.id}).active=true;save()"> Public</label><br><label><input type="radio" name="acc" ${g.access=="Private"?"checked":""} onchange="gameById(${g.id}).access='Private';gameById(${g.id}).active=false;save()"> Private</label><br><label><input type="checkbox" ${g.friendsOnly?"checked":""} onchange="gameById(${g.id}).friendsOnly=this.checked;save()"> Friends Only</label>`;
 if(t=="Permissions")return `<p>Edit permissions: only you.</p><div class="row"><input placeholder="Add collaborator"><button onclick="toast('Collaborator added')">Add</button></div>`;
 if(t=="Version History")return `<table><tr><th>Version</th><th>Date</th><th></th></tr>${[3,2,1].map(v=>`<tr><td>${v}</td><td>${dstr(g.updated-(3-v)*DAY)}</td><td><button onclick="toast('Reverted to version ${v}')">Revert</button></td></tr>`).join("")}</table>`;
 if(t=="Developer Products")return `<h3>Game Passes</h3>${g.passes.map(p=>`<div>${esc(p.name)} — B$ ${p.price}</div>`).join("")}<div class="row" style="margin-top:8px"><input id="npn" placeholder="Pass name"><input id="npp" type="number" placeholder="Price" style="width:90px"><button class="btn-green" onclick="const g=gameById(${g.id});g.passes.push({id:'p'+nid(),name:$('#npn').value||'Pass',price:+$('#npp').value||10});save();route()">Create Game Pass</button></div>`;
 return `<h3>Badges</h3>${g.badges.map(b=>`<div>${esc(b.n)} — ${esc(b.d)}</div>`).join("")}<div class="row"><input id="nbn" placeholder="Badge name"><button class="btn-green" onclick="gameById(${g.id}).badges.push({n:$('#nbn').value||'Badge',d:'Custom badge',r:50});save();route()">Create Badge</button></div><h3>Advanced</h3><label><input type="checkbox" checked> Filtering Enabled</label><br><label><input type="checkbox"> Allow third party sales</label>`}
function saveCfg(id){const g=gameById(id);g.name=$("#cfn").value;g.desc=$("#cfd").value;g.genre=$("#cfg").value;g.maxp=+$("#cfm").value;g.updated=now();save();toast("Saved!")}

/* --- economy --- */
function pageBux(){return `<div class="wrap"><h1>Buy Bux</h1><p>Bux let you buy upgrades for your avatar or special abilities in games.</p><div class="row wrapflex" style="align-items:flex-start">${[["Builders Club Members",[[400,"$4.99"],[800,"$9.99"],[1700,"$19.99"],[4500,"$49.99"],[10000,"$99.99"]],1.1],["Non-Members",[[400,"$4.99"],[800,"$9.99"],[1700,"$19.99"],[4500,"$49.99"],[10000,"$99.99"]],1]].map(([t,l,m])=>`<div class="card" style="flex:1;min-width:280px"><h3>${t}</h3>${l.map(([n,p])=>`<div class="row between" style="border-bottom:1px solid var(--bd);padding:8px 0"><span>${buxIco(16)} <b>${comma(Math.round(n*m))}</b></span><button class="btn-green" ${m>1&&!S.me.bc?"disabled title='Builders Club only'":""} onclick="checkout(${Math.round(n*m)},'${p}')">${p}</button></div>`).join("")}</div>`).join("")}</div>
 <div class="card"><h3>Redeem BLOX Card</h3><div class="row"><input id="gc" maxlength="10" placeholder="10-digit code"><button class="btn-blue" onclick="redeem()">Redeem Card</button><span id="gcmsg"></span></div></div></div>`}
function checkout(n,p){modal(`<h3>Checkout</h3><div style="background:#fff3b0;color:#111;padding:6px;border-radius:3px;font-weight:700;text-align:center">DEMO — no real payment</div><p>${comma(n)} Bux for ${p}</p><p>Payment Method: <b>[Fake Card] •••• 0000</b></p><button class="btn-green" onclick="S.bux+=${n};addTxn('Bux purchase',${n},'Purchases');save();closeModal();renderHeader();toast('${comma(n)} Bux added!')">Purchase</button>`)}
function redeem(){const v=$("#gc").value;if(/^\d{10}$/.test(v)){S.bux+=800;addTxn("Redeemed card",800,"Purchases");save();renderHeader();$("#gcmsg").innerHTML="<span class=price>800 Bux added!</span>"}else $("#gcmsg").innerHTML="<span style='color:#E2231A'>Invalid code</span>"}
const TIERS=[["Classic",15,10,1],["Turbo",35,20,2],["Outrageous",60,100,3]];
function pageBC(parts,qs){const per=qs.per||"Monthly";const price={Monthly:[5.95,11.95,19.95],"6 Month":[29.95,59.95,99.95],"12 Month":[57.95,115.95,189.95]}[per];
 return `<div class="wrap"><h1>Builders Club</h1><div class="row">${["Monthly","6 Month","12 Month"].map(p=>`<button class="${p==per?"btn-blue":""}" onclick="setQ('per','${p}')">${p}</button>`).join("")}</div><div class="row wrapflex" style="margin-top:10px;align-items:stretch">${TIERS.map(([n,d,g,t],k)=>`<div class="card" style="flex:1;text-align:center;min-width:200px">${bcIcon(t,60)}<h2>${n}</h2><p>${d} Bux daily<br>Join ${g} groups</p><h3>$${price[k]}</h3>${S.me.bc==t?`<b class="price">Current Plan</b>`:`<button class="btn-green" onclick="S.me.bc=${t};S.bux+=${d};addTxn('Builders Club stipend',${d},'Premium Stipend');save();toast('Welcome to ${n} Builders Club! (demo)');refresh()">Upgrade Now</button>`}</div>`).join("")}</div>
 <div class="card"><table><tr><th></th><th>Free</th>${TIERS.map(t=>`<th>${t[0]}</th>`).join("")}</tr>${[["Daily Bux","—","15","35","60"],["Join Groups","5","10","20","100"],["Create Groups","—","10","20","100"],["Ad Free","✗","✓","✓","✓"],["Sell Stuff","✗","✓","✓","✓"],["Trade","✗","✓","✓","✓"],["Bonus Gear","✗","✓","✓","✓"],["Bux Bonus","—","10%","10%","10%"]].map(r=>`<tr>${r.map((c,i)=>i?`<td>${c}</td>`:`<th>${c}</th>`).join("")}</tr>`).join("")}</table>${S.me.bc?`<button onclick="S.me.bc=0;save();refresh()">Cancel Membership</button>`:""}</div></div>`}
function pageTxn(parts,qs){const tab=qs.tab||"Summary",per=qs.per||"Past Week";const span={"Past Day":1,"Past Week":7,"Past Month":30,"Past Year":365}[per]*DAY;const l=S.txns.filter(t=>now()-t.t<span);const sum=k=>l.filter(t=>t.type==k).reduce((a,t)=>a+t.amt,0);
 return `<div class="wrap"><h1>My Transactions</h1><div class="tabs">${["Summary","My Transactions"].map(t=>`<div class="${t==tab?"on":""}" onclick="setQ('tab','${t}')">${t}</div>`).join("")}</div><div class="card">${tab=="Summary"?`<select onchange="setQ('per',this.value)">${["Past Day","Past Week","Past Month","Past Year"].map(p=>`<option ${p==per?"selected":""}>${p}</option>`).join("")}</select><table>${["Sale of Goods","Group Payouts","Premium Stipend","Purchases"].map(k=>`<tr><td>${k}</td><td>${buxIco(12)} ${comma(sum(k))}</td></tr>`).join("")}<tr><th>Total</th><th>${comma(l.reduce((a,t)=>a+t.amt,0))}</th></tr></table>`:`<table><tr><th>Date</th><th>Member</th><th>Description</th><th>Amount</th></tr>${S.txns.map(t=>`<tr><td>${dstr(t.t)}</td><td>${esc(t.member)}</td><td>${esc(t.desc)}</td><td style="color:${t.amt<0?"#D86868":"#02B757"}">${t.amt}</td></tr>`).join("")||"<tr><td colspan=4 class=muted>No transactions yet.</td></tr>"}</table>`}</div></div>`}

function pageForum(parts,qs){if(qs.t){const t=S.threads.find(x=>x.id==qs.t);if(!t)return page404();t.views++;

  $("#ribbon").innerHTML=B.map(b=>`<button class="${b==tool?"on":""}" data-b="${b}"><svg width="26" height="26" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" fill="${{Play:"#02B757",Run:"#02B757",Stop:"#E2231A",Part:"#A1A5A2"}[b]||"#00A2FF"}"/></svg>${b}</button>`).join("");
  $$("#ribbon button").forEach(b=>b.onclick=()=>act(b.dataset.b,t))}
 function act(b,t){if(["Select","Move","Scale","Rotate"].includes(b)){tool=b;rib(t);return}
  if(b=="Part"){const p={name:"Part",x:Math.round(Math.random()*20-10),y:0,z:Math.round(Math.random()*20-10),sx:4,sy:1.2,sz:2,color:"#A1A5A2",anchored:true,ry:0};g.parts.push(p);mk(p);select(p);persist();log("Inserted Part")}
  else if(b=="Play"||b=="Run"){persist();log("Running place in client...");closeStudio();play(g.id)}else if(b=="Stop")log("Stopped.");
  else if(b=="Anchor"&&sel){sel.anchored=!sel.anchored;select(sel)}else log(b+" (not available in this demo)")}
 $$(".ribtabs div").forEach(d=>d.onclick=()=>{$$(".ribtabs div").forEach(x=>x.classList.remove("on"));d.classList.add("on");rib(d.dataset.rt)});rib("Home");
 $("#tbox").innerHTML=["Tree","House","Spawn","Brick Wall","Tower","Ramp"].map(n=>`<div style="padding:6px;cursor:pointer;border-bottom:1px solid #eee" data-n="${n}">▣ ${n}</div>`).join("");
 $$("#tbox div").forEach(d=>d.onclick=()=>{const n=d.dataset.n;const x=Math.round(Math.random()*30-15),z=Math.round(Math.random()*30-15);const add=(o)=>{const p={name:n,x,z,y:0,ry:0,anchored:true,...o};g.parts.push(p);mk(p);return p};
  if(n=="Tree"){add({sx:1,sy:6,sz:1,color:"#624732"});add({y:6,sx:5,sy:4,sz:5,color:"#4B974B"})}else if(n=="House"){add({sx:10,sy:6,sz:10,color:"#C4281C"});add({y:6,sx:11,sy:1,sz:11,color:"#624732"})}else if(n=="Spawn")add({sx:6,sy:1,sz:6,color:"#2154B9"});else if(n=="Brick Wall")add({sx:16,sy:6,sz:1,color:"#A34B4B"});else if(n=="Tower")add({sx:4,sy:20,sz:4,color:"#635F62"});else add({sx:4,sy:2,sz:8,color:"#F5CD30"});persist();drawExp();log("Inserted "+n+" from Toolbox")});
 function drawExp(){$("#exp").innerHTML=`<div>▾ Workspace</div><div style="padding-left:18px">Camera</div><div style="padding-left:18px">Baseplate</div>`+g.parts.map((p,i)=>`<div style="padding-left:18px" class="${p===sel?"sel":""}" data-i="${i}">▣ ${esc(p.name)}</div>`).join("")+["Players","Lighting","ReplicatedFirst","ReplicatedStorage","ServerScriptService","ServerStorage","StarterGui","StarterPack","StarterPlayer","SoundService","Chat"].map(s=>`<div>▸ ${s}</div>`).join("");$$("#exp [data-i]").forEach(d=>d.onclick=()=>select(g.parts[+d.dataset.i]))}
 function select(p){const old=sel;sel=p;if(old&&meshes.get(old))upd(meshes.get(old),old);if(p)upd(meshes.get(p),p);drawExp();
  $("#props").innerHTML=p?`<table style="font-size:12px">${[["Name","name","text"],["BrickColor","color","color"],["Position X","x"],["Position Y","y"],["Position Z","z"],["Size X","sx"],["Size Y","sy"],["Size Z","sz"]].map(([l,k,ty])=>`<tr><td>${l}</td><td><input data-k="${k}" type="${ty||"number"}" value="${esc(p[k])}" style="width:100px;font-size:12px;padding:1px"></td></tr>`).join("")}<tr><td>Anchored</td><td><input type="checkbox" id="panc" ${p.anchored?"checked":""}></td></tr></table><button id="pdel" style="font-size:12px">Delete</button>`:"<p style='color:#888'>Select an object.</p>";
  if(p){$$("#props [data-k]").forEach(i=>i.onchange=()=>{const k=i.dataset.k;p[k]=i.type=="number"?Math.max(k[0]=="s"?.2:-999,+i.value):i.value;upd(meshes.get(p),p);persist();drawExp()});$("#panc").onchange=e=>{p.anchored=e.target.checked;persist()};$("#pdel").onclick=()=>{scene.remove(meshes.get(p));meshes.delete(p);g.parts.splice(g.parts.indexOf(p),1);sel=null;select(null);persist();log("Deleted "+p.name)}}}
 select(null);
 const rc=new T.Raycaster(),plane=new T.Plane(new T.Vector3(0,1,0),0);
 const ndc=e=>{const r=ren.domElement.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*2-1,y:-(e.clientY-r.top)/r.height*2+1}};
 ren.domElement.oncontextmenu=e=>e.preventDefault();let rd=null;
 ren.domElement.onmousedown=e=>{if(e.button==2){rd={x:e.clientX,y:e.clientY};return}rc.setFromCamera(ndc(e),cam);const hits=rc.intersectObjects([...meshes.values()]);if(hits[0]){const p=[...meshes].find(([k,v])=>v===hits[0].object)[0];select(p);if(tool!="Select"){drag={p,sx:e.clientX,sy:e.clientY,o:{...p}};const pt=new T.Vector3();rc.ray.intersectPlane(plane,pt);drag.pt=pt}}else select(null)};
 window.onmousemove=e=>{if(rd){cy-=(e.clientX-rd.x)*.01;cp=Math.max(.1,Math.min(1.5,cp+(e.clientY-rd.y)*.01));rd={x:e.clientX,y:e.clientY};return}if(!drag)return;const p=drag.p;
  if(tool=="Move"){rc.setFromCamera(ndc(e),cam);const pt=new T.Vector3();if(rc.ray.intersectPlane(plane,pt)){p.x=Math.round(drag.o.x+pt.x-drag.pt.x);p.z=Math.round(drag.o.z+pt.z-drag.pt.z);if(e.shiftKey)p.y=Math.max(0,Math.round(drag.o.y-(e.clientY-drag.sy)*.1))}}
  else if(tool=="Scale"){p.sx=Math.max(1,Math.round(drag.o.sx+(e.clientX-drag.sx)*.1));p.sy=Math.max(.2,Math.round((drag.o.sy-(e.clientY-drag.sy)*.1)*5)/5)}
  else if(tool=="Rotate")p.ry=drag.o.ry+(e.clientX-drag.sx)*.02;
  upd(meshes.get(p),p)};
 window.onmouseup=()=>{if(drag){persist();select(drag.p);log(tool+" "+drag.p.name)}drag=null;rd=null};
 ren.domElement.onwheel=e=>{e.preventDefault();cd=Math.max(10,Math.min(300,cd*(e.deltaY>0?1.1:.9)))};
 $("#sclose").onclick=()=>{closeStudio();go("#/develop")};
 log("BLOX Studio ready. Right-drag to orbit, wheel to zoom. Move tool: drag (Shift+drag = up/down).");
 SD={gid:g.id,raf:0,ren};
 (function loop(){if(!SD)return;SD.raf=requestAnimationFrame(loop);const w=vp.clientWidth,h=vp.clientHeight;if(ren.domElement.width!=w*devicePixelRatio||ren.domElement.height!=h*devicePixelRatio){ren.setPixelRatio(devicePixelRatio);ren.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
  cam.position.set(Math.sin(cy)*Math.cos(cp)*cd,Math.sin(cp)*cd,Math.cos(cy)*Math.cos(cp)*cd);cam.lookAt(0,0,0);ren.render(scene,cam)})();
 return null}
function closeStudio(){if(SD){cancelAnimationFrame(SD.raf);SD.ren.dispose();SD=null}window.onmousemove=window.onmouseup=null;$("#studio").classList.remove("on");$("#studio").innerHTML=""}

/* ================= BOOT ================= */
if(S.settings.theme=="dark")document.body.classList.add("dark");
refresh();
loadNoob();

</script>
</body>
